services:
  app:
    image: emr-app
    ports:
      - "8080:8080"
    environment:
      # WARTOŚĆ NIE JEST commit-owana. Trzymaj ją lokalnie w pliku .env (gitignored).
      # Wygeneruj nowy klucz: openssl rand -base64 32
      SECURITY_ENC_MASTER_KEY: ${SECURITY_ENC_MASTER_KEY:?SECURITY_ENC_MASTER_KEY must be set in .env}
      SECURITY_ENC_ACTIVE_KEY_ID: ${SECURITY_ENC_ACTIVE_KEY_ID:-k1}
